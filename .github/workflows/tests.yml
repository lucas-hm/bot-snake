name: GITHUB CI --> Bot dev_sentinel by Lucas Moran

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./bot-snake-main

    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar versiones de Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: 'bot-snake-main/requirements.txt'

    - name: Instalar dependencias del proyecto
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest flake8 pytest-cov coverage

    - name: Verificación de sintaxis (Linter)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv

    - name: Probar importación del Engine
      run: |
        PYTHONPATH=./BOT/dev_sentinel python -c "import BOT.dev_sentinel.game_engine; print('Engine cargado correctamente')"

    - name: Ejecutar Tests Unitarios (Carpeta tests)
      run: |
        PYTHONPATH=. pytest ./BOT/dev_sentinel/tests
        
    - name: Simulación de partida con reporte de Cobertura
      run: |
        if [ -f "run_local_match_with_bot.py" ]; then
          PYTHONPATH=. coverage run --source=BOT/dev_sentinel -m pytest ./BOT/dev_sentinel/tests
          coverage report -m --omit="**/juego.py,**/ws_client.py,**/main.py,**/client_runner.py"
        fi
    
    - name: Instalar dependencias del proyecto
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest flake8 pytest-cov coverage xenon

    - name: Análisis de complejidad con Radon
      run: |
        radon cc -s -a .